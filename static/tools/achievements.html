<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Achievements — Clan Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/shell.css">
<link rel="stylesheet" href="/static/css/achievements.css">
</head>
<body class="shell-body" data-tool="achievements">

  <div id="nav-backdrop" aria-hidden="true"></div>
  <aside id="nav-drawer" aria-hidden="true" aria-label="Tools">
    <div class="nav-drawer-head">
      <span class="title">Clan Tools</span>
      <button type="button" class="nav-drawer-close" id="nav-drawer-close" aria-label="Close menu">&times;</button>
    </div>
    <ul class="nav-tools" id="nav-tools"></ul>
    <div class="nav-drawer-foot">
      <button id="theme-toggle" type="button" title="Switch to light mode" aria-label="Switch to light mode">
        <svg class="theme-icon theme-icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
        <svg class="theme-icon theme-icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"/>
        </svg>
        <span class="theme-toggle-label">Appearance</span>
      </button>
      <div class="nav-drawer-blurb">Shared market snapshots — Merch, Achievements, Alch, Movers.</div>
    </div>
  </aside>

  <header id="shell-top">
    <button type="button" id="nav-toggle" aria-label="Open tools menu" title="Tools">
      <span class="burger" aria-hidden="true"><span></span><span></span><span></span></span>
    </button>
    <div class="shell-brand">
      <div class="name">Clan <em>Tools</em></div>
      <div class="sub">Achievements · clan feed</div>
    </div>
    <div id="tool-chrome">
      <div id="statusline"><span class="lamp" id="lamp" aria-hidden="true"></span><span id="status">loading…</span></div>
    </div>
    <div class="shell-actions">
    </div>
  </header>

  <div id="tool-slot">
    <div class="ach-layout">
      <aside class="ach-rail">
        <div class="rail-title">Filters</div>
        <label class="field">Type
          <select id="f-type">
            <option value="">Any</option>
            <option value="drop">Drop</option>
            <option value="collection_log">Collection log</option>
            <option value="combat_ach">Combat achievement</option>
            <option value="clue">Clue</option>
            <option value="custom">Custom</option>
          </select>
        </label>
        <label class="field">Min value (gp)
          <input id="f-min" type="text" placeholder="e.g. 1m" autocomplete="off">
        </label>
        <label class="field">User id
          <input id="f-user" type="number" min="1" placeholder="optional" autocomplete="off">
        </label>
        <button type="button" id="f-apply" class="ghost">Apply</button>
        <div class="rail-title" style="margin-top:18px">RuneLite ingest</div>
        <p class="hint">Token authenticates the plugin. Shown once on rotate.</p>
        <div id="token-prefix" class="mono">prefix: —</div>
        <button type="button" id="token-rotate" class="ghost">Rotate token</button>
        <pre id="token-once" class="token-once" hidden></pre>
      </aside>
      <main class="ach-main">
        <div id="ach-list" class="ach-list"><div class="empty">loading…</div></div>
      </main>
    </div>
  </div>

<script src="/static/js/shell.js"></script>
<script src="/static/js/shell-user.js"></script>
<script src="/static/js/tool-status.js"></script>
<script src="/static/js/achievements.js"></script>
</body>
</html>
