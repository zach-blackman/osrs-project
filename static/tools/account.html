<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Account — Clan Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/shell.css">
<link rel="stylesheet" href="/static/css/account.css">
</head>
<body class="shell-body" data-tool="account">

  <div id="nav-backdrop" aria-hidden="true"></div>
  <aside id="nav-drawer" aria-hidden="true" aria-label="Tools">
    <div class="nav-drawer-head">
      <span class="title">Clan Tools</span>
      <button type="button" class="nav-drawer-close" id="nav-drawer-close" aria-label="Close menu">&times;</button>
    </div>
    <ul class="nav-tools" id="nav-tools"></ul>
    <div class="nav-drawer-foot">
      <button id="theme-toggle" type="button" title="Switch to light mode" aria-label="Switch to light mode">
        <svg class="theme-icon theme-icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
        <svg class="theme-icon theme-icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"/>
        </svg>
        <span class="theme-toggle-label">Appearance</span>
      </button>
      <div class="nav-drawer-blurb">Your Discord profile and clan preferences.</div>
    </div>
  </aside>

  <header id="shell-top">
    <button type="button" id="nav-toggle" aria-label="Open tools menu" title="Tools">
      <span class="burger" aria-hidden="true"><span></span><span></span><span></span></span>
    </button>
    <div class="shell-brand">
      <div class="name">Clan <em>Tools</em></div>
      <div class="sub">My Account</div>
    </div>
    <div id="tool-chrome"></div>
    <div class="shell-actions"></div>
  </header>

  <div id="tool-slot">
    <div class="account-wrap">
      <section class="account-profile" id="account-profile">
        <h1>Profile</h1>
        <p class="lede">Signed in via Discord. These fields come from your identity provider.</p>
        <div class="account-profile-card" id="profile-card">loading…</div>
      </section>
      <section class="account-prefs">
        <h1>Clan prefs</h1>
        <p class="lede">Optional overrides used across Clan Tools.</p>
        <form id="prefs-form" class="prefs-form">
          <label>
            <span>Display name</span>
            <input id="pref-display-name" type="text" maxlength="128" autocomplete="nickname"
                   placeholder="Leave blank to use Discord name">
          </label>
          <label>
            <span>RSN</span>
            <input id="pref-rsn" type="text" maxlength="12" autocomplete="off"
                   placeholder="Old School RuneScape name">
          </label>
          <label>
            <span>Theme</span>
            <select id="pref-theme">
              <option value="dark">Dark</option>
              <option value="light">Light</option>
            </select>
          </label>
          <div class="prefs-actions">
            <button type="submit" class="primary" id="prefs-save">Save</button>
            <span class="prefs-status" id="prefs-status" hidden></span>
          </div>
        </form>
      </section>
    </div>
  </div>

<script src="/static/js/shell.js"></script>
<script src="/static/js/shell-user.js"></script>
<script src="/static/js/account.js"></script>
</body>
</html>
